<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmation - AnimeStore</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="page-container">
    <div id="confirmation-content"></div>
  </div>

  <div id="footer"></div>
  <script src="js/app.js"></script>
  <script>
    injectHeader('confirmation');
    injectFooter();

    function renderConfirmation() {
      const raw = sessionStorage.getItem('last_order');
      if (!raw) {
        document.getElementById('confirmation-content').innerHTML = `
          <div class="cart-empty">
            <h3>No recent order found</h3>
            <p style="margin-bottom:20px">Looks like you haven't placed an order yet.</p>
            <a href="products.html" class="btn btn-primary">Shop Now</a>
          </div>
        `;
        return;
      }

      const order = JSON.parse(raw);
      const isSuccess = order.status === 'completed';
      const icon = isSuccess ? '\u2713' : '\u23F3';
      const title = isSuccess ? 'Payment Successful!' : 'Order Placed!';
      const message = isSuccess
        ? 'Your payment has been received. We will deliver your items soon!'
        : order.payment_method === 'bank'
          ? 'Your order has been placed. Please complete the bank transfer to confirm your order.'
          : 'Your order has been placed. We are processing your payment.';

      let itemsHTML = order.items.map(item => `
        <div class="summary-row">
          <span>${item.name} x ${item.quantity}</span>
          <span>${formatPrice(item.price * item.quantity)}</span>
        </div>
      `).join('');

      document.getElementById('confirmation-content').innerHTML = `
        <div class="order-success">
          <div class="check-icon">${icon}</div>
          <h2>${title}</h2>
          <p>${message}</p>
          <div class="order-details">
            <div class="summary-row"><span>Customer</span><span>${order.name}</span></div>
            <div class="summary-row"><span>Email</span><span style="font-size:0.85rem">${order.email}</span></div>
            <div class="summary-row"><span>Phone</span><span>${order.phone}</span></div>
            <div class="summary-row"><span>Address</span><span style="font-size:0.82rem;text-align:right;max-width:200px">${order.address}</span></div>
            <div class="summary-row"><span>Payment</span><span>${order.payment_method === 'esewa' ? 'eSewa' : 'Bank Payment'}</span></div>
            <div class="summary-row"><span>Status</span><span style="font-weight:600;color:${isSuccess ? 'var(--success)' : 'var(--warning)'}">${isSuccess ? 'Completed' : 'Pending'}</span></div>
            <hr style="border:none;border-top:1px solid var(--border);margin:12px 0">
            ${itemsHTML}
            <div class="summary-row total"><span>Total Paid</span><span class="price">${formatPrice(order.total)}</span></div>
          </div>
          <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
            <a href="products.html" class="btn btn-primary">Continue Shopping</a>
            <a href="orders.html" class="btn btn-secondary">View My Orders</a>
          </div>
        </div>
      `;

      sessionStorage.removeItem('last_order');
    }

    renderConfirmation();
  </script>
</body>
</html>
