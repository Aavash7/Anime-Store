<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - AnimeStore</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="page-container">
    <h1 class="page-title">All Products</h1>

    <div class="search-bar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search-input" placeholder="Search anime products...">
    </div>

    <div class="category-filters" id="category-filters"></div>

    <div class="products-grid" id="products-grid">
      <div class="loading"><div class="spinner"></div>Loading products...</div>
    </div>
  </div>

  <div id="footer"></div>
  <script src="js/app.js"></script>
  <script>
    if (typeof injectHeader === 'function') injectHeader('products');
    if (typeof injectFooter === 'function') injectFooter();

    const STORAGE_KEY = 'animestore_products';
    let allProducts = [];
    let activeCategory = 'all';
    let searchQuery = '';

    function getItems() {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    }

    function getCategories() {
      const cats = [...new Set(allProducts.map(p => p.category || 'General'))];
      return cats;
    }

    function renderCategories() {
      const container = document.getElementById('category-filters');
      const cats = getCategories();
      const chips = ['all', ...cats].map(c =>
        `<button class="category-chip ${activeCategory === c ? 'active' : ''}" onclick="filterCategory('${escapeHtml(c).replace(/'/g, "\\'")}')">${c === 'all' ? 'All' : escapeHtml(c)}</button>`
      ).join('');
      container.innerHTML = chips;
    }

    function filterCategory(cat) {
      activeCategory = cat;
      renderCategories();
      renderProducts();
    }

    function renderProducts() {
      let filtered = allProducts;
      if (activeCategory !== 'all') {
        filtered = filtered.filter(p => (p.category || 'General') === activeCategory);
      }
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        filtered = filtered.filter(p =>
          (p.name && p.name.toLowerCase().includes(q)) ||
          (p.description && p.description.toLowerCase().includes(q)) ||
          (p.category && p.category.toLowerCase().includes(q))
        );
      }

      if (filtered.length === 0) {
        document.getElementById('products-grid').innerHTML =
          '<p style="text-align:center;color:var(--text-secondary,#6c757d);grid-column:1/-1;padding:40px">No products found. Try a different search or category.</p>';
        return;
      }

      document.getElementById('products-grid').innerHTML = filtered.map(p => {
        const stock = p.stock !== undefined ? p.stock : 10;
        const category = p.category || 'General';
        const priceText = typeof formatPrice === 'function' ? formatPrice(p.price) : `Rs. ${Number(p.price).toFixed(2)}`;

        const stockBadge = stock > 0
          ? `<span class="stock-badge stock-in">In Stock</span>`
          : `<span class="stock-badge stock-out">Out of Stock</span>`;

        return `
          <div class="product-card">
            <img src="${escapeHtml(p.image_url)}" alt="${escapeHtml(p.name)}" class="product-image" loading="lazy" onerror="this.src='https://via.placeholder.com/200?text=No+Image'">
            <div class="product-info">
              <span class="product-category">${escapeHtml(category)}</span>
              ${stockBadge}
              <h3 class="product-name">${escapeHtml(p.name)}</h3>
              <p class="product-description">${escapeHtml(p.description || '')}</p>
              <div class="product-footer">
                <span class="product-price">${priceText}</span>
                <button class="btn-add-cart" onclick="addToCart('${p.id}','${escapeHtml(p.name).replace(/'/g, "\\'")}',${p.price},'${escapeHtml(p.image_url)}');if(typeof showToast==='function')showToast('Added to cart')" ${stock <= 0 ? 'disabled style="opacity:0.5;cursor:not-allowed"' : ''}>
                  Add to Cart
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function loadProducts() {
      try {
        allProducts = getItems();

        const params = new URLSearchParams(window.location.search);
        const cat = params.get('category');
        if (cat) activeCategory = cat;

        renderCategories();
        renderProducts();
      } catch (err) {
        document.getElementById('products-grid').innerHTML =
          '<p style="text-align:center;color:var(--text-secondary,#6c757d);grid-column:1/-1">Could not load products. Please try again later.</p>';
      }
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderProducts();
    });

    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEY) loadProducts();
    });

    loadProducts();
  </script>
</body>
</html>
