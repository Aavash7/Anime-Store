<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - AnimeStore</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="auth-container">
    <div class="auth-card">
      <h2>Create Account</h2>
      <p>Join AnimeStore and start shopping</p>
      <div class="auth-error" id="auth-error"></div>
      <form id="signup-form" onsubmit="return handleSignUp(event)">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="At least 6 characters" minlength="6">
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" required placeholder="Re-enter password">
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="signup-btn">Create Account</button>
      </form>
      <p class="auth-link">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>

  <div id="footer"></div>
  <script src="js/app.js"></script>
  <script>
    injectHeader('signup');
    injectFooter();

    if (isLoggedIn()) {
      window.location.href = 'index.html';
    }

    function showError(msg) {
      const el = document.getElementById('auth-error');
      el.textContent = msg;
      el.classList.add('show');
    }

    async function handleSignUp(event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm-password').value;
      const btn = document.getElementById('signup-btn');

      if (password !== confirm) {
        showError('Passwords do not match');
        return false;
      }

      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        const result = await authSignUp(email, password);
        if (result.session) {
          saveSession(result.session);
          showToast('Account created successfully');
          setTimeout(() => window.location.href = 'index.html', 500);
        } else {
          showToast('Account created. Please log in.');
          setTimeout(() => window.location.href = 'login.html', 1000);
        }
      } catch (err) {
        showError(err.message || 'Sign up failed. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
      return false;
    }
  </script>
</body>
</html>
